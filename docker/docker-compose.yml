services:
  mongodb:
    image: mongo:7
    container_name: home-wealth-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: home-wealth
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
